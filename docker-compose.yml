services:
  backend:
    build: ./backend
    restart: always
    environment:
      - MONGO_URL=${MONGO_URL}
      - DB_NAME=cashcar
      - JWT_SECRET=${JWT_SECRET}
      # Allow frontend domain (including www)
      - CORS_ORIGINS=https://${DOMAIN_NAME},https://www.${DOMAIN_NAME},http://localhost
      # S3 / Hetzner Object Storage
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_REGION=${S3_REGION}
    networks:
      - cashcar-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_BACKEND_URL=https://${DOMAIN_NAME}
    restart: always
    environment:
      # This variable is needed at BUILD time for React (passed via args above)
      - REACT_APP_BACKEND_URL=https://${DOMAIN_NAME}
    networks:
      - cashcar-net

  caddy:
    image: caddy:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile
    networks:
      - cashcar-net

networks:
  cashcar-net:


volumes:
  caddy_data:
  caddy_config:
