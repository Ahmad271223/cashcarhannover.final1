services:
  # Backend Service
  - type: web
    name: cashcar-backend
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && python -m uvicorn server:app --host 0.0.0.0 --port 10000 --workers 4
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: cashcar
      - key: JWT_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://cashcar-frontend.onrender.com,http://localhost:3000

  # Frontend Service
  - type: web
    name: cashcar-frontend
    env: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: REACT_APP_BACKEND_URL
        fromService:
          type: web
          name: cashcar-backend
          property: url
